[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

; The generated headers are read from firmware/braille_tutor/ rather than copied
; in. They are header-only, and a copy is exactly how this sketch ends up
; testing a model the main firmware no longer runs -- the stale-model failure
; the sketch exists to catch.
build_flags =
    -I$PROJECT_DIR/../../braille_tutor
