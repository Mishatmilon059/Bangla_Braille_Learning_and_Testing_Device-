[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; rule_engine.h and model_data.h are read from firmware/braille_tutor/ rather
; than copied in, so this always scores the model the firmware actually runs.
build_flags =
    -I$PROJECT_DIR/../../braille_tutor
