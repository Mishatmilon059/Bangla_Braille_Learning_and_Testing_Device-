<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Project status and roadmap</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">Where the project stands today</text>
<text x="60" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="normal" fill="#6B7280" text-anchor="start">Honest status of every stage — data collection and verification are now done</text>
<rect x="60" y="150" width="460" height="450" rx="12" ry="12" fill="#ECFAF4" stroke="#059669" stroke-width="2.5"/>
<text x="82" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#059669" text-anchor="start">BUILT AND TESTED</text>
<text x="82" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Web simulation app</text>
<text x="82" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Supabase database and schema</text>
<text x="82" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Rule engine in three languages</text>
<text x="82" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Synthetic data generator</text>
<text x="82" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Real data collected — 1,000 rows</text>
<text x="82" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Model trained on real + synthetic</text>
<text x="102" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">98.6% / 91.4% real-only acc.</text>
<text x="82" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Braille map — 50 of 50 verified</text>
<text x="82" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  ESP32 firmware (written)</text>
<text x="82" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Six hardware bring-up sketches</text>
<text x="82" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Automated test suites</text>
<text x="82" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Braille image importer</text>
<rect x="560" y="150" width="460" height="450" rx="12" ry="12" fill="#FEF6EC" stroke="#D97706" stroke-width="2.5"/>
<text x="582" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#D97706" text-anchor="start">PARTLY DONE</text>
<text x="582" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Physical assembly — breadboard</text>
<text x="602" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">subset only: buttons + speaker.</text>
<text x="602" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">Motors, DFPlayer, full wiring</text>
<text x="602" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">not yet assembled</text>
<text x="582" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Audio: 60 clips generated by</text>
<text x="602" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">speech synthesis (espeak-ng) —</text>
<text x="602" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">usable now, should be re-recorded</text>
<text x="602" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">by a human speaker before a demo</text>
<rect x="1060" y="150" width="460" height="450" rx="12" ry="12" fill="#FEF0F0" stroke="#DC2626" stroke-width="2.5"/>
<text x="1082" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#DC2626" text-anchor="start">PLANNED</text>
<text x="1082" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Full physical hardware assembly</text>
<text x="1102" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">— wiring all 6 motors + DFPlayer</text>
<text x="1082" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Teacher mobile app</text>
<text x="1102" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">(web teacher panel exists; a</text>
<text x="1102" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">dedicated mobile app does not)</text>
<text x="1082" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">•  Human-recorded audio</text>
<text x="1102" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="start">to replace synthetic speech</text>
<rect x="60" y="630" width="1480" height="170" rx="12" ry="12" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/>
<text x="84" y="668" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">THE CRITICAL PATH NOW</text>
<text x="84" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start">The hard, calendar-bound work is done: 1,000 real rows across 4 volunteers, all 50 Braille letters verified against the Bangladesh standard, and the</text>
<text x="84" y="731" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start">model retrained to 98.6% / 91.4% real-only accuracy. What is left is assembly and production work, not research risk.</text>
<text x="84" y="758" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start"></text>
<text x="84" y="785" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start">Remaining: solder the full motor + DFPlayer wiring onto the breadboard subset, re-record audio with a human voice, and build the teacher mobile app.</text>
</svg>
