<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Teaching actions and their origin</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">The three teaching actions, and where they come from</text>
<text x="60" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="normal" fill="#6B7280" text-anchor="start">Ordered rules, first match wins — written explicitly, then learned by the network</text>
<rect x="1480.0" y="44" width="58.400000000000006" height="26" rx="13.0" ry="13.0" fill="#ECFAF4" stroke="#059669" stroke-width="1.5"/>
<text x="1509.2" y="61.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">BUILT</text>
<rect x="60" y="150" width="460" height="250" rx="12" ry="12" fill="#FEF0F0" stroke="#DC2626" stroke-width="2.5"/>
<circle cx="94" cy="190" r="18" fill="#DC2626" stroke="#DC2626" stroke-width="2"/>
<text x="94" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#111827" text-anchor="start">REPEAT</text>
<text x="80" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">First wrong attempt on this</text>
<text x="80" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">prompt — just try again,</text>
<text x="80" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">no help yet.</text>
<rect x="80" y="322" width="420" height="58" rx="10" ry="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="92" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="start">wrong_streak &gt;= 1  AND</text>
<text x="92" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="start">retry_count == 0</text>
<rect x="560" y="150" width="460" height="250" rx="12" ry="12" fill="#FEF6EC" stroke="#D97706" stroke-width="2.5"/>
<circle cx="594" cy="190" r="18" fill="#D97706" stroke="#D97706" stroke-width="2"/>
<text x="594" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="626" y="196" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#111827" text-anchor="start">HINT</text>
<text x="580" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Still wrong after retrying —</text>
<text x="580" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">keep helping on THIS character</text>
<text x="580" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">every subsequent wrong try.</text>
<rect x="580" y="322" width="420" height="58" rx="10" ry="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="592" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706" text-anchor="start">wrong_streak &gt;= 1</text>
<text x="592" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706" text-anchor="start">(rule 1 already caught retry==0)</text>
<rect x="1060" y="150" width="460" height="250" rx="12" ry="12" fill="#ECFAF4" stroke="#059669" stroke-width="2.5"/>
<circle cx="1094" cy="190" r="18" fill="#059669" stroke="#059669" stroke-width="2"/>
<text x="1094" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1126" y="196" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#111827" text-anchor="start">NORMAL_PRACTICE</text>
<text x="1080" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">wrong_streak == 0, so the</text>
<text x="1080" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">attempt just scored was</text>
<text x="1080" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">correct — move on normally.</text>
<rect x="1080" y="322" width="420" height="58" rx="10" ry="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<text x="1092" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="start">default — no conditions,</text>
<text x="1092" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="start">falls through otherwise</text>
<text x="60" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Retired in spec v2: INCREASE_DIFFICULTY, REVIEW_PREVIOUS and WORD_PRACTICE — abandoning the current letter mid-struggle taught nothing about the letter the learner actually needed.</text>
<rect x="60" y="470" width="1480" height="152" rx="12" ry="12" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/>
<text x="84" y="508" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#111827" text-anchor="start">WHERE THESE DECISIONS COME FROM</text>
<circle cx="100" cy="544" r="13" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="100" y="549" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="126" y="549" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">The rules are hand-written from teaching principles (spec/engine_spec.json), and applied live while data is collected.</text>
<circle cx="100" cy="582" r="13" fill="#0D9488" stroke="#0D9488" stroke-width="2"/>
<text x="100" y="587" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="126" y="587" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">The TA network is trained on those decisions and reproduces them at 98.6% real-only — small enough to run on the ESP32.</text>
<rect x="60" y="642" width="1480" height="148" rx="12" ry="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="84" y="674" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">WORKED EXAMPLE — one learner, one letter, four attempts in a row</text>
<rect x="84" y="690" width="335" height="88" rx="10" ry="10" fill="#FEF0F0" stroke="#DC2626" stroke-width="2"/>
<text x="100" y="712" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Attempt 1 — wrong</text>
<text x="100" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">wrong_streak=1, retry_count=0</text>
<rect x="100" y="742" width="303" height="28" rx="14" ry="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="251.5" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">REPEAT</text>
<path d="M 422 734 L 440 734" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="444" y="690" width="335" height="88" rx="10" ry="10" fill="#FEF6EC" stroke="#D97706" stroke-width="2"/>
<text x="460" y="712" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Attempt 2 — wrong (retry)</text>
<text x="460" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">wrong_streak=2, retry_count=1</text>
<rect x="460" y="742" width="303" height="28" rx="14" ry="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="611.5" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">HINT</text>
<path d="M 782 734 L 800 734" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="804" y="690" width="335" height="88" rx="10" ry="10" fill="#FEF6EC" stroke="#D97706" stroke-width="2"/>
<text x="820" y="712" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Attempt 3 — wrong (retry)</text>
<text x="820" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">wrong_streak=3, retry_count=2</text>
<rect x="820" y="742" width="303" height="28" rx="14" ry="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="971.5" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">HINT</text>
<path d="M 1142 734 L 1160 734" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1164" y="690" width="335" height="88" rx="10" ry="10" fill="#ECFAF4" stroke="#059669" stroke-width="2"/>
<text x="1180" y="712" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Attempt 4 — correct</text>
<text x="1180" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">wrong_streak=0, current_streak=1</text>
<rect x="1180" y="742" width="303" height="28" rx="14" ry="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<text x="1331.5" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">NORMAL_PRACTICE</text>
<text x="60" y="866" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">The model does not invent teaching strategy. It compresses an explicit policy into a 867-parameter network so it can run offline on a microcontroller.</text>
</svg>
