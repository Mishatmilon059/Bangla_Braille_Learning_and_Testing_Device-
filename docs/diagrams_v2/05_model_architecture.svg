<text x="60" y="454" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">Same shape, trained independently — inputs are shared, weights are not. Both run on every attempt; neither depends on the other's output.</text>
<rect x="60" y="486" width="1480" height="110" rx="12" ry="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="84" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Parameters (both nets)</text>
<text x="84" y="542" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">1,734</text>
<text x="449" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Exported as</text>
<text x="449" y="542" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">C float32 arrays</text>
<text x="814" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">On-device weight size</text>
<text x="814" y="542" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">6,936 B</text>
<text x="1179" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Teaching acc. (real)</text>
<text x="1179" y="542" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">98.6%</text>
<text x="84" y="572" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Confidence acc. (real)</text>
<text x="84" y="594" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">91.4%</text>
<text x="449" y="572" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Boot self-test</text>
<text x="449" y="594" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">20 / 20 match</text>
<text x="814" y="572" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Inference time</text>
<text x="814" y="594" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">~0.1 ms, both</text>
<text x="1179" y="572" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">Training time</text>
<text x="1179" y="594" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">&lt; 30 s, CPU</text>
<rect x="60" y="616" width="1480" height="145" rx="12" ry="12" fill="#FEF6EC" stroke="#D97706" stroke-width="2.5"/>
<text x="84" y="652" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#D97706" text-anchor="start">WHAT THIS MODEL ACTUALLY DOES — state this plainly in the report</text>
<text x="84" y="686" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">The training labels are produced by a hand-written rule engine, so the networks learn to REPRODUCE that engine — measured at 98.6% / 91.4% real-only agreement.</text>
<text x="84" y="712" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">That is a real embedded-ML result: an adaptive teaching policy compressed into 1,734 parameters (6.8 KB) that run offline on a $4 microcontroller, no runtime library.</text>
<text x="84" y="738" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#111827" text-anchor="start">It is not autonomous discovery of teaching strategy and must not be described that way. The interesting evidence is where the model disagrees with the engine.</text>
<text x="60" y="866" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">sklearn MLPClassifier, not TensorFlow (incompatible with Python 3.12 on Windows) — weights are exported directly as C arrays, no TFLite, no arena.</text>
</svg>
