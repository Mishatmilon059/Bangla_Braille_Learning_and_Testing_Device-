<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Teaching action and confidence decision flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">How wrong_streak and retries drive the two decisions</text>
<text x="60" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="normal" fill="#6B7280" text-anchor="start">Exact thresholds from spec/engine_spec.json — first match wins, top to bottom</text>
<rect x="1480.0" y="44" width="58.400000000000006" height="26" rx="13.0" ry="13.0" fill="#ECFAF4" stroke="#059669" stroke-width="1.5"/>
<text x="1509.2" y="61.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">BUILT</text>
<text x="430" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0D9488" text-anchor="middle">TEACHING ACTION  (from wrong_streak, retry_count)</text>
<rect x="320" y="170" width="220" height="46" rx="23" ry="23" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<text x="430" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">attempt just scored</text>
<path d="M 430 216 L 430 254" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 430 254 L 580 300 L 430 346 L 280 300 Z" fill="#F6F7F9" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">wrong_streak &gt;= 1 ?</text>
<path d="M 430 346 L 430 384" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="444" y="370.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="start">no</text>
<rect x="300" y="384" width="260" height="56" rx="10" ry="10" fill="#ECFAF4" stroke="#059669" stroke-width="2.5"/>
<text x="430" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#059669" text-anchor="middle">NORMAL_PRACTICE</text>
<path d="M 580 300 L 660 300" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="620.0" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">yes</text>
<path d="M 810 254 L 950 300 L 810 346 L 670 300 Z" fill="#F6F7F9" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="810" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">retry_count == 0 ?</text>
<path d="M 810 346 L 810 384" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="824" y="370.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="start">yes</text>
<rect x="680" y="384" width="260" height="56" rx="10" ry="10" fill="#FEF0F0" stroke="#DC2626" stroke-width="2.5"/>
<text x="810" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">REPEAT</text>
<path d="M 950 300 L 1076 300" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1013.0" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">no</text>
<rect x="1080" y="272" width="260" height="56" rx="10" ry="10" fill="#FEF6EC" stroke="#D97706" stroke-width="2.5"/>
<text x="1210" y="302" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#D97706" text-anchor="middle">HINT</text>
<text x="430" y="506" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#DB2777" text-anchor="middle">CONFIDENCE STATE  (from retries, response_time, press_duration, wrong_streak)</text>
<path d="M 430 510 L 620 560 L 430 610 L 240 560 Z" fill="#F6F7F9" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">retry_count&gt;=2  OR</text>
<text x="430" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">response_time&gt;=6000ms ?</text>
<path d="M 430 610 L 430 648" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="444" y="634.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="start">yes</text>
<rect x="300" y="648" width="260" height="56" rx="10" ry="10" fill="#FEF0F0" stroke="#DC2626" stroke-width="2.5"/>
<text x="430" y="678" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">GUESSING</text>
<path d="M 620 560 L 690 560" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="655.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">no</text>
<path d="M 900 500 L 1110 560 L 900 620 L 690 560 Z" fill="#F6F7F9" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="900" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">response_time&lt;=2500  AND  retry==0</text>
<text x="900" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">AND wrong_streak==0 AND press&lt;=400ms ?</text>
<path d="M 900 620 L 900 658" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="914" y="644.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6B7280" text-anchor="start">yes</text>
<rect x="770" y="658" width="260" height="56" rx="10" ry="10" fill="#ECFAF4" stroke="#059669" stroke-width="2.5"/>
<text x="900" y="688" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#059669" text-anchor="middle">CONFIDENT</text>
<path d="M 1110 560 L 1190 560" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1150.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">no</text>
<rect x="1190" y="532" width="260" height="56" rx="10" ry="10" fill="#FEF6EC" stroke="#D97706" stroke-width="2.5"/>
<text x="1320" y="562" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">HESITANT (default)</text>
<text x="60" y="866" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Both decisions run independently on the same attempt — a GUESSING confidence state and a REPEAT action can, and often do, fire together.</text>
</svg>
