<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Dot Control</title>
<style>
  :root {
    --bg:#111; --panel:#1b1b1b; --ink:#eee; --muted:#888;
    --accent:#3ddc84; --err:#ff5a5a; --line:#2c2c2c; --warn:#e0b33d;
  }
  * { box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--ink); margin:0; padding:24px 16px 48px;
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  h1 { font-size:20px; font-weight:600; margin:0; }
  .sub { color:var(--muted); font-size:13px; margin-top:-8px; text-align:center; max-width:44ch; }

  .device-row {
    display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted);
  }
  .device-row input {
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:6px 8px; border-radius:6px; font-size:13px; width:120px;
  }

  .section-label {
    width:100%; max-width:720px; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:-6px;
  }

  .grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));
    gap:8px; width:100%; max-width:720px;
  }
  button.letter {
    position:relative; aspect-ratio:1; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; transition:transform .08s ease, background .15s ease; padding:4px;
  }
  button.letter .ch { font-size:22px; font-weight:600; line-height:1; }
  button.letter .rm { font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  button.letter:active { transform:scale(0.94); background:var(--accent); color:#08210f; }
  button.letter:active .rm { color:#08210f; opacity:.7; }
  button.letter:disabled { opacity:.5; cursor:default; }
  button.letter.placeholder::after {
    content:""; position:absolute; top:5px; right:5px; width:5px; height:5px;
    border-radius:50%; background:var(--warn);
  }

  .legend { display:flex; gap:16px; font-size:11.5px; color:var(--muted); align-items:center; }
  .legend .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--warn); margin-right:5px; vertical-align:middle; }

  .log {
    width:100%; max-width:720px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); padding:10px 12px; display:flex; flex-direction:column;
    gap:6px; max-height:220px; overflow-y:auto; font-size:12.5px; font-family:ui-monospace,monospace;
  }
  .log .entry { display:flex; justify-content:space-between; gap:10px; }
  .log .ok { color:var(--accent); }
  .log .fail { color:var(--err); }
  .log .empty { color:var(--muted); text-align:center; padding:8px 0; }
</style>
</head>
<body>

  <h1>Remote Dot Control</h1>
  <p class="sub">Tap a letter to play its full Braille pattern on the ESP32, over Supabase. No IP or credentials needed on either side.</p>

  <div class="device-row">
    device_id
    <input id="deviceId" value="esp32_01">
  </div>

  <div class="legend"><span><span class="dot"></span>placeholder pattern, not yet verified</span></div>

  <div class="section-label">Vowels</div>
  <div class="grid" id="vowelGrid"></div>

  <div class="section-label">Consonants</div>
  <div class="grid" id="consonantGrid"></div>

  <div class="log" id="log">
    <div class="empty">nothing sent yet</div>
  </div>

<script>
  // Same publishable key already used in web/config.js and t7_cloud_dot.ino.
  // It is designed to ship in every client -- safe here, not a secret.
  const SUPABASE_URL = "https://rufaacgatrebsyxnyfbq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_lI3qv5Xk44GAhzL4R7I2GA_4k1aUar-";

  const deviceIdInput = document.getElementById('deviceId');
  const log = document.getElementById('log');
  const vowelGrid = document.getElementById('vowelGrid');
  const consonantGrid = document.getElementById('consonantGrid');

  function addLog(text, ok) {
    if (log.querySelector('.empty')) log.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'entry';
    const time = new Date().toLocaleTimeString();
    row.innerHTML = `<span class="${ok ? 'ok' : 'fail'}">${text}</span><span>${time}</span>`;
    log.prepend(row);
  }

  async function sendLetter(letter, btn) {
    btn.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/remote_commands`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify({
          device_id: deviceIdInput.value.trim() || 'esp32_01',
          letter_id: letter.id,
        }),
      });
      if (res.ok) {
        addLog(`sent ${letter.char} / ${letter.name} (#${letter.id})`, true);
      } else {
        const body = await res.text();
        addLog(`${letter.name} failed: ${res.status}`, false);
        console.error('insert failed', res.status, body);
      }
    } catch (err) {
      addLog(`${letter.name} failed: offline?`, false);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  function renderLetter(letter, grid) {
    const btn = document.createElement('button');
    btn.className = 'letter' + (letter.verified ? '' : ' placeholder');
    btn.title = `#${letter.id} ${letter.name} / ${letter.roman}` +
                (letter.verified ? '' : ' -- placeholder pattern');
    btn.innerHTML = `<span class="ch">${letter.char}</span><span class="rm">${letter.roman}</span>`;
    btn.addEventListener('click', () => sendLetter(letter, btn));
    grid.appendChild(btn);
  }

  async function loadMap() {
    let map = null;
    for (const path of ['./data/braille_map.json', '../data/braille_map.json', '/data/braille_map.json']) {
      try {
        const res = await fetch(path);
        if (res.ok) { map = await res.json(); break; }
      } catch { /* try next path */ }
    }
    if (!map) {
      addLog('could not load braille_map.json', false);
      return;
    }
    for (const letter of map.letters) {
      renderLetter(letter, letter.category === 'vowel' ? vowelGrid : consonantGrid);
    }
  }

  loadMap();
</script>
</body>
</html>
