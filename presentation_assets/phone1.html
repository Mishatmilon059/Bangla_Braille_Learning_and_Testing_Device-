<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    width: 600px;
    height: 1050px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  
    :root {
      --phone-w: 400px;
      --phone-h: 840px;
      --bezel: 12px;
      --radius-outer: 50px;
      --radius-inner: 38px;
    }

    .phone-wrapper {
      position: relative;
      display: inline-block;
      margin: 30px 40px;
      filter: drop-shadow(0 30px 50px rgba(15, 23, 42, 0.28))
              drop-shadow(0 10px 20px rgba(15, 23, 42, 0.15));
    }

    /* Side physical buttons */
    .btn-action {
      position: absolute;
      left: -3px;
      top: 130px;
      width: 4px;
      height: 28px;
      background: #334155;
      border-radius: 2px 0 0 2px;
    }
    .btn-vol-up {
      position: absolute;
      left: -3px;
      top: 175px;
      width: 4px;
      height: 52px;
      background: #334155;
      border-radius: 2px 0 0 2px;
    }
    .btn-vol-down {
      position: absolute;
      left: -3px;
      top: 238px;
      width: 4px;
      height: 52px;
      background: #334155;
      border-radius: 2px 0 0 2px;
    }
    .btn-power {
      position: absolute;
      right: -3px;
      top: 185px;
      width: 4px;
      height: 75px;
      background: #334155;
      border-radius: 0 2px 2px 0;
    }

    /* Metallic phone body */
    .phone-chassis {
      width: calc(var(--phone-w) + var(--bezel) * 2);
      height: calc(var(--phone-h) + var(--bezel) * 2);
      background: linear-gradient(145deg, #2d3748, #0f172a 40%, #1e293b 80%, #334155);
      border-radius: var(--radius-outer);
      padding: var(--bezel);
      position: relative;
      box-shadow: 
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.2),
        inset 0 0 0 3px rgba(0, 0, 0, 0.8);
    }

    /* Top speaker grill */
    .phone-speaker {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3.5px;
      background: #090d16;
      border-radius: 3px;
      z-index: 100;
    }

    /* Phone display area */
    .phone-screen {
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: var(--radius-inner);
      overflow: hidden;
      background: #f8fafc;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    /* Status Bar */
    .status-bar {
      height: 42px;
      min-height: 42px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      z-index: 50;
      border-bottom: 1px solid rgba(0, 0, 0, 0.02);
    }
    .status-time {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      width: 108px;
      height: 27px;
      background: #090a0f;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e293b, #090d16 70%);
      box-shadow: inset 0 0 2px rgba(56, 189, 248, 0.4);
    }
    .camera-sensor {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #042f2e;
    }

    /* Status Icons */
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }
    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 11px;
    }
    .signal-bars span {
      width: 2.5px;
      background: #0f172a;
      border-radius: 0.5px;
    }
    .signal-bars span:nth-child(1) { height: 3px; }
    .signal-bars span:nth-child(2) { height: 5px; }
    .signal-bars span:nth-child(3) { height: 8px; }
    .signal-bars span:nth-child(4) { height: 11px; }

    .battery-icon {
      width: 21px;
      height: 11px;
      border: 1.5px solid #0f172a;
      border-radius: 3px;
      padding: 1px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .battery-icon::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2.5px;
      width: 2px;
      height: 4px;
      background: #0f172a;
      border-radius: 0 1px 1px 0;
    }
    .battery-fill {
      height: 100%;
      width: 85%;
      background: #16a34a;
      border-radius: 1px;
    }

    /* Screen content viewport */
    .screen-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
    }
    .screen-img-full {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Screen 1 Docked nav */
    .screen1-body-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .screen1-spacer {
      flex: 1;
      background: #f3f4f6;
    }
    .screen1-nav-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Bottom Home Indicator */
    .home-indicator-bar {
      height: 22px;
      min-height: 22px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .home-indicator {
      width: 125px;
      height: 4px;
      background: #94a3b8;
      border-radius: 2px;
    }
    
  .phone-wrapper {
    margin: 0;
  }
</style>
</head>
